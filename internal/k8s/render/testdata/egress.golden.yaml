apiVersion: k8s.f5net.com/v3
kind: F5SPKEgress
metadata:
  name: egress-agents
  namespace: f5-bnk
spec:
  egressSnatpoolMode: UNIQUE_SNAT_ADDRESS
  maxTmmReplicas: 1
  snatType: SRC_TRANS_AUTOMAP
  pseudoCNIConfig:
    appPodInterface: eth0
    namespaces:
    - egress-test
    vxlan:
      create: true
      key: 100
      mtu: 1410
      nodeInterfaceName: ens5
      port: 5789
      tmmInterfaceName: external
      vrf: ""
---
apiVersion: v1
kind: Pod
metadata:
  name: egress-client
  namespace: egress-test
spec:
  nodeSelector:
    cloud.google.com/gke-nodepool: agent-pool
  containers:
  - name: netshoot
    image: nicolaka/netshoot
    command: ["sleep", "infinity"]
