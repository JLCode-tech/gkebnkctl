# Rendered by internal/k8s/render.RenderCNEInstance from cluster.yaml +
# Phase25-discovered state (docs/SPEC-go-tracer.md §5 per-file mapping).
# Converted from reference/bash-seed/manifests/05-cneinstance.yaml.tmpl
# (${VAR} envsubst) to Go text/template placeholders.
#
# advanced.tmm.env carries the mandatory host-device env
# (reference/TRIAL-NOTES.md contract item 3):
#   TMM_MAPRES_ADDL_VETHS_ON_DP=TRUE
#   PCIDEVICE_INTEL_COM_EXT / PCIDEVICE_INTEL_COM_INT — mapres SKIPS an
#   interface without a PCIDEVICE_* env ref ("Environment variable
#   reference is required"); TMM_MAPRES_IFC_CLAIM_LIST alone does NOT work.
apiVersion: k8s.f5.com/v1
kind: CNEInstance
metadata:
  name: instance
  namespace: f5-bnk
spec:
  advanced:
    cneController:
      env:
      - name: TMM_DEFAULT_MTU
        value: "1460"
    demoMode:
      enabled: true
    envDiscovery:
      enabled: false
      runAfterSuccess: true
      stopOnFail: true
    maintenanceMode:
      enabled: false
    tmm:
      env:
      - name: TMM_DEFAULT_MTU
        value: "1460"
      - name: ZEBOS_STATE
        value: legacy
      - name: TMM_GENERIC_SOCKET_DRIVER
        value: "true"
      - name: TMM_MAPRES_ADDL_VETHS_ON_DP
        value: "TRUE"
      - name: PCIDEVICE_INTEL_COM_EXT
        value: "0000:00:05.0"
      - name: PCIDEVICE_INTEL_COM_INT
        value: "0000:00:06.0"
  certificate:
    clusterIssuer: ext-ca-cluster-issuer
  coreCollection:
    enabled: false
  deploymentSize: Small
  dpu:
    enabled: false
  dynamicRouting:
    enabled: false
  firewallACL:
    enabled: false
  manifestVersion: "2.4.0-3.2882.0"
  networkAttachments:
  - tmm-ext
  - tmm-int
  product:
    gatewayAPI: true
    type: BNK
  pseudoCNI:
    enabled: true
  registry:
    imagePullPolicy: Always
    imagePullSecrets:
    - name: far-secret
    uri: repo.f5.com
  telemetry:
    loggingSubsystem:
      enabled: false
    metricSubsystem:
      enabled: false
  wholeCluster: true
