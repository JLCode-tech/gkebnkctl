# gitleaks configuration for gkebnkctl.
# CI runs gitleaks via the security-audit job in .github/workflows/ci.yml.
# This file extends the default ruleset and allowlists known false positives.
title = "gkebnkctl gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "internal manifests, test templates, and example configs containing public keys, placeholders, or dummy secrets."
paths = [
  '''internal/k8s/manifests/templates/.*''',
  '''internal/forge/.*''',
  '''examples/.*''',
  '''cluster\.yaml''',
]
