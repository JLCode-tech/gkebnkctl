version: 2

project_name: gkebnkctl

before:
  hooks:
    - go mod tidy

builds:
  - id: gkebnkctl
    main: ./cmd/gkebnkctl
    binary: gkebnkctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/JLCode-tech/gkebnkctl/internal/cli.Version={{.Version}}
      - -X github.com/JLCode-tech/gkebnkctl/internal/cli.Commit={{.Commit}}
      - -X github.com/JLCode-tech/gkebnkctl/internal/cli.BuildDate={{.Date}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge remote-tracking branch

release:
  header: |
    ## gkebnkctl {{ .Tag }}

    Google Cloud GKE cloud-pinned CLI for deploying, operating, and benchmarking **F5 BIG-IP Next for Kubernetes (BNK)** and **F5 BNK AI Service Plane**.
    *(Tip: Use the unified multi-cloud [**`bnkctl`**](https://github.com/JLCode-tech/bnkctl) CLI as the preferred entry point across AWS, Azure, and GCP.)*
  footer: |
    ---
    See [`CHANGELOG.md`](https://github.com/JLCode-tech/gkebnkctl/blob/main/CHANGELOG.md) for the full per-version change log.

    Verify the downloaded archive against `checksums.txt`:
    ```
    sha256sum -c checksums.txt --ignore-missing
    ```
