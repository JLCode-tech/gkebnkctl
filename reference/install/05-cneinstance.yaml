apiVersion: k8s.f5.com/v1
kind: CNEInstance
metadata:
  name: instance
  namespace: f5-bnk
spec:
  advanced:
    cneController:
      env:
      - name: TMM_DEFAULT_MTU
        value: "1460"
    demoMode:
      enabled: true
    envDiscovery:
      enabled: false
      runAfterSuccess: true
      stopOnFail: true
    maintenanceMode:
      enabled: false
    tmm:
      env:
      - name: TMM_DEFAULT_MTU
        value: "1460"
      - name: ZEBOS_STATE
        value: legacy
      - name: TMM_GENERIC_SOCKET_DRIVER
        value: "true"
  certificate:
    clusterIssuer: ext-ca-cluster-issuer
  coreCollection:
    enabled: false
  deploymentSize: Small
  dpu:
    enabled: false
  dynamicRouting:
    enabled: false
  firewallACL:
    enabled: false
  manifestVersion: 2.4.0-3.2882.0
  networkAttachments:
  - tmm-ext
  - tmm-int
  product:
    gatewayAPI: true
    type: BNK
  pseudoCNI:
    enabled: true
  registry:
    imagePullPolicy: Always
    imagePullSecrets:
    - name: far-secret
    uri: repo.f5.com
  telemetry:
    loggingSubsystem:
      enabled: false
    metricSubsystem:
      enabled: false
  wholeCluster: true
