apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: tmm-ext
  namespace: f5-bnk
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "external-network",
      "type": "host-device",
      "device": "eth1",
      "ipam": {
        "type": "static",
        "addresses": [{"address": "10.31.0.50/28"}]
      }
    }
---
