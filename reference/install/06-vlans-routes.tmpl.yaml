# Fill EXT_SELFIP / INT_SELFIP / TMM_POD_GW after node-pool creation:
#   EXT_SELFIP  = 2nd usable IP of the tmm node's GKE-allocated /28 from tmm-ext-pods (e.g. slice 10.31.0.64/28 -> 10.31.0.66)
#   INT_SELFIP  = same for tmm-int-pods (e.g. 10.51.0.64/28 -> 10.51.0.66)
#   TMM_POD_GW  = tmm node podCIDR .1 (from pods2 10.66.0.0/16 per-node /24)
apiVersion: k8s.f5net.com/v1
kind: F5SPKVlan
metadata:
  name: external
  namespace: f5-bnk
spec:
  name: external
  category: external
  interfaces:
  - "1.1"
  internal: true
  mtu: 1460
  prefixlen_v4: 16
  selfip_v4s:
  - EXT_SELFIP
  tag: 0
  auto_lasthop: AUTO_LASTHOP_DEFAULT
  cmp_hash: DEFAULT
  pod_hash: DISABLED
  trunk_hash: src-dst-ipport
  bonded: false
  allowed_services:
  - port: ""
    protocol: "1"
  - port: "5789"
    protocol: udp
---
apiVersion: k8s.f5net.com/v1
kind: F5SPKVlan
metadata:
  name: internal
  namespace: f5-bnk
spec:
  name: internal
  interfaces:
  - "1.2"
  internal: true
  mtu: 1460
  prefixlen_v4: 16
  selfip_v4s:
  - INT_SELFIP
  tag: 0
  auto_lasthop: AUTO_LASTHOP_DEFAULT
  cmp_hash: DEFAULT
  pod_hash: DISABLED
  trunk_hash: src-dst-ipport
  bonded: false
  allowed_services: []
---
apiVersion: k8s.f5net.com/v1
kind: F5SPKStaticRoute
metadata:
  name: route-ext-gw
  namespace: f5-bnk
spec:
  destination: 10.30.0.1
  prefixLen: 32
  type: interface
  interface: external
---
apiVersion: k8s.f5net.com/v1
kind: F5SPKStaticRoute
metadata:
  name: route-ext-underlay
  namespace: f5-bnk
spec:
  destination: 10.30.0.0
  prefixLen: 16
  gateway: 10.30.0.1
  type: gateway
---
apiVersion: k8s.f5net.com/v1
kind: F5SPKStaticRoute
metadata:
  name: route-cluster-pods
  namespace: f5-bnk
spec:
  destination: 10.66.0.0
  prefixLen: 16
  gateway: TMM_POD_GW
  type: gateway
---
apiVersion: k8s.f5net.com/v1
kind: F5SPKStaticRoute
metadata:
  name: route-default-egress
  namespace: f5-bnk
spec:
  destination: 0.0.0.0
  prefixLen: 0
  gateway: 10.50.0.1
  type: gateway
