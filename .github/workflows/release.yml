name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/gkebnkctl-linux-amd64 ./cmd/gkebnkctl
          GOOS=darwin GOARCH=amd64 go build -o dist/gkebnkctl-darwin-amd64 ./cmd/gkebnkctl
          GOOS=darwin GOARCH=arm64 go build -o dist/gkebnkctl-darwin-arm64 ./cmd/gkebnkctl
          GOOS=windows GOARCH=amd64 go build -o dist/gkebnkctl-windows-amd64.exe ./cmd/gkebnkctl
          
      - name: Generate Checksums
        working-directory: dist
        run: |
          sha256sum gkebnkctl-* > checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/gkebnkctl-linux-amd64
            dist/gkebnkctl-darwin-amd64
            dist/gkebnkctl-darwin-arm64
            dist/gkebnkctl-windows-amd64.exe
            dist/checksums.txt
          generate_release_notes: true
