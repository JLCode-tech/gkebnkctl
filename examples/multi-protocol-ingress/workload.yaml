apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-tcp
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app-tcp
  template:
    metadata:
      labels:
        app: demo-app-tcp
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-tcp-svc
  namespace: default
spec:
  selector:
    app: demo-app-tcp
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app-udp
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app-udp
  template:
    metadata:
      labels:
        app: demo-app-udp
    spec:
      containers:
      - name: coredns
        image: coredns/coredns:1.10.1
        args: ["-conf", "/etc/coredns/Corefile"]
        ports:
        - containerPort: 53
          protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-udp-svc
  namespace: default
spec:
  selector:
    app: demo-app-udp
  ports:
  - protocol: UDP
    port: 53
    targetPort: 53
