# SA1019 (deprecated-symbol usage) is disabled repo-wide.
#
# The container/apiv1 GKE SDK's ProjectId/Zone/ClusterId/NodePoolId/
# OperationId request fields (used throughout internal/gcp/phases and
# internal/gcp/phases/fakes_test.go since Task B — see
# docs/SPEC-go-tracer.md §8) are marked deprecated by the upstream .proto in
# favor of a single fully-qualified Name field
# ("projects/*/locations/*/clusters/*"). This codebase intentionally kept
# the ID-based constructors, matching the bash seed's discrete
# --project/--zone/--cluster gcloud flags and keeping the fake-client
# request/response shapes in internal/gcp/phases/fakes_test.go simple.
#
# Migrating every GKEAPI call site to Name-based addressing is an
# architectural change, not something Task E (CI + docs) should make as a
# side effect of turning on staticcheck for the first time. Tracked as a
# follow-up rather than silently fixed here.
checks = ["all", "-SA1019"]
